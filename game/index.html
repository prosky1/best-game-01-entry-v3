<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Pilot — a sky-high arcade glider</title>
<style>
  /* The page is only a frame for the canvas: dark backdrop, the game
     centred, nothing else on screen. */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1c1836;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    touch-action: none;
    cursor: pointer;
    /* The renderer paints at 320x180 and scales up 4x with smoothing
       off; keep the browser's own scaling crisp too. */
    image-rendering: pixelated;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Paper Pilot: hold mouse or space to climb, release to glide. Fly through golden rings, dodge storm clouds, birds and diving paper hawks, reach the Sun Gate at 3000 metres."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
